# Шаблон скилла tnlife-miniapp-engineering: конфиг OTel Collector для
# локального стенда. Норма — 08-observability.md §2.
# Подставьте ozm в комментарии; тело — копия ../../otel-collector.yaml.
#
# КУДА КЛАСТЬ: infra/env.local/otel/config.yaml — этот путь читает проверка
# [11/15] (в файле обязаны быть подстроки receivers и otlp).
#
# От исходного infra/observability/otel-collector.yaml файл отличается ровно
# двумя вещами (08 §2): экспортёры пайплайнов [debug] вместо
# [debug, otlp/external] и САМОГО exporters.otlp/external здесь нет. Форвард
# наружу локально выключен — телеметрия видна в логах контейнера ozm-otel.
#
# ПОЧЕМУ БЛОК ЭКСПОРТЁРА УДАЛЁН, А НЕ ОСТАВЛЕН «НА ВСЯКИЙ СЛУЧАЙ»: коллектор
# валидирует ВСЕ объявленные экспортёры, даже те, которых нет ни в одном
# пайплайне. Стоит otlp/external здесь — поставляемый .env.otel роняет
# локальный коллектор в крэш-луп: с адресом контура — «address
# REPLACE_WITH_OTLP_ENDPOINT: missing port in address», после шага 3
# env.local/README.md с пустым адресом — «requires a non-empty "endpoint"»
# (проверено на образах коллектора 0.111.0 и 0.158.0). Поэтому
# OTLP_* локально не читаются вовсе.
# Проверка: `docker run --rm -v $PWD/env.local/otel/config.yaml:/etc/otel/local.yaml \
#   otel/opentelemetry-collector-contrib:0.111.0 validate --config=/etc/otel/local.yaml`
# — без вывода и с кодом 0, в том числе с окружением из env.local/.env.otel.
# Проверка дрейфа: `diff env.local/otel/config.yaml observability/otel-collector.yaml`
# показывает только шапку, блок exporters.otlp/external и экспортёры пайплайнов.
#
# Конфиги stage и prod из этого файла НЕ делаются: их раскладывает
# `make -C infra otel-sync` из исходного конфига. Правите пайплайн — правьте
# исходный конфиг, затем перенесите те же строки сюда.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Скрейп /metrics приложения (решение D5, 08 §9): бэкенд отдаёт метрики на
  # отдельном порту METRICS_ADDR=:9090, который compose держит только в expose
  # (внутри сети, наружу не публикуется), а коллектор ходит к нему по имени
  # сервиса. job_name — контракт с alerts.yaml (лейбл job="ozm", в том
  # числе up{job} у BackendDown) и с 08 §4: переименовали — правьте оба файла
  # одним PR. Ресивер prometheus есть только в дистрибутиве
  # otel/opentelemetry-collector-contrib (образ в docker-compose.yaml); в core
  # его нет. Чтение docker-логов (receiver filelog) — то же место, если нужно.
  prometheus:
    config:
      scrape_configs:
        - job_name: ozm
          # honor_labels: собственный лейбл серии не переименовывается в
          # exported_*. Нужен для метрик фоновых задач (08 §4, §5): у них есть
          # СВОЙ лейбл job — имя воркера (job="pdn_purge"), и без honor_labels
          # скрейпер переписал бы его в exported_job, а правила alerts.yaml
          # ждут job. Серии без своего job (http_requests_total, up) получают
          # job=ozm от скрейпа. Принято обоими образами коллектора,
          # 0.111.0 и 0.158.0 (validate на каркасе набора).
          honor_labels: true
          scrape_interval: 15s
          static_configs:
            - targets: ["ozm-api:9090"]

processors:
  batch:
    send_batch_max_size: 1000
    timeout: 10s
    send_batch_size: 100
  resourcedetection:
    detectors: [env, system]
    timeout: 5s
    override: false
  memory_limiter:
    check_interval: 1s
    limit_mib: 200

exporters:
  debug:
    verbosity: normal

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777

service:
  extensions: [health_check, pprof]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [debug]
