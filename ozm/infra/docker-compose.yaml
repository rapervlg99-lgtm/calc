# Нормативная поставка OZM (§2.2): лимиты ресурсов, healthcheck у каждого сервиса,
# container_name совпадает с именем сервиса, мониторинг не поднимается как сервис
# (§1.8 — OTel-коллектор отдельно, конфиги в infra/env.<контур>/otel/).
#
# Стенд повторяет бланк корпоративного шаблона: вход один — ozm-web, маршруты
# раздаёт ozm-traefik по labels (`api.localhost`, `app.localhost`, `oidc.localhost`),
# локальный профиль `local` добавляет прокси, БД в контейнере, мок Цифрового
# профиля и почту. API публикуется только внутри сети (`ozm-api:8080`) — снаружи
# к нему ходят через web (nginx проксирует /api/), коллектор скрейпит метрики.
#
# Имена сервисов — те же, что в контурах инфраструктуры: PGHOST=ozm-postgres
# (env.<контур>/.env.pg) резолвится в сервис ozm-postgres, OTEL_EXPORTER_OTLP_ENDPOINT
# смотрит на ozm-otel, nginx фронта — на ozm-api и ozm-ocr. Переименование сервиса
# без правки контура ломает стенд молча, на первом же соединении.
#
# Запуск (как это делает Makefile набора): контур подставляет ENV_DIR, значения
# для интерполяции приходят --env-file, профиль — COMPOSE_PROFILES:
#   ENV_DIR=env.local OTEL_CONFIG_DIR=./env.local/otel COMPOSE_PROFILES=local \
#   docker compose -p ozm -f docker-compose.yaml \
#     --env-file env.local/.env.app --env-file env.local/.env.pg \
#     --env-file env.local/.env.oidc --env-file env.local/.env.otel \
#     --env-file env.local/.env.smtp up -d
# Без профиля published-порт ровно один — вход web; локальный стенд разработчика
# (порты 5173/8080/8000 на 127.0.0.1) — dev/docker-compose.local.yml.
name: ozm

x-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

x-limits: &limits-small
  resources:
    limits: { cpus: "0.50", memory: 512M }
    reservations: { cpus: "0.10", memory: 128M }

services:
  # ── Вход стенда: TLS-прокси по labels (профиль local) ───────────────────────
  ozm-traefik:
    profiles: ["local"]
    # ОТСТУПЛЕНИЕ OZM по версии: бланк нормы пинует traefik v3.1.7, но его
    # docker-провайдер не разговаривает с демоном Docker Desktop (проверено
    # прогоном: «Failed to retrieve information of the docker client and server
    # host», у 3.5 — «API returned a 400 (Bad Request) but provided no
    # error-message»); на 3.6.25 маршруты из labels читаются. Нормативный пин
    # v3.1.7 возвращается, когда стенд едет на linux-демоне, где он и проверялся.
    image: ${DOCKER_PROXY_HOST_1:-docker.io}/traefik:v3.6.25
    container_name: ozm-traefik
    logging: *default-logging
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--ping=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
      # Панель traefik — только на петлю: наружу она не смотрит.
      - "127.0.0.1:8090:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      # Динамический конфиг: TLS для *.localhost на самоподписанном сертификате
      # (certs/local.crt, certs/local.key создаёт цель up Makefile; в git их нет).
      - "./env.local/traefik:/etc/traefik/dynamic:ro"
    networks:
      - ozm-net
    deploy: *limits-small
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── Почта стенда (профиль local) ────────────────────────────────────────────
  ozm-mailpit:
    profiles: ["local"]
    image: ${DOCKER_PROXY_HOST_1:-docker.io}/axllent/mailpit:v1.21.8
    container_name: ozm-mailpit
    logging: *default-logging
    environment:
      MP_SMTP_BIND_ADDR: "0.0.0.0:2525"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    networks:
      - ozm-net
    ports:
      - "127.0.0.1:2525:2525"
      - "127.0.0.1:8025:8025"
    deploy: *limits-small
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── Мок Цифрового профиля (OIDC): профили local и oidc-mock ─────────────────
  ozm-oidc:
    profiles: ["local", "oidc-mock"]
    image: ${OIDC_MOCK_IMAGE:-ghcr.io/navikt/mock-oauth2-server:2.1.10}
    container_name: ozm-oidc
    logging: *default-logging
    environment:
      SERVER_PORT: "5556"
      JSON_CONFIG_PATH: /etc/oidc/config.json
      # Издатель обязан совпасть с OIDC_TRUSTED_ISSUER в env.<контур>/.env.oidc
      # и с issuerId в config.json: URL мока — <issuer>/default/.well-known/…
      ISSUER_URL: https://oidc.localhost/default
    volumes:
      - ./env.local/oidc:/etc/oidc:ro
    networks:
      - ozm-net
    ports:
      - "127.0.0.1:5556:5556"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ozm-oidc.rule=Host(`oidc.localhost`)"
      - "traefik.http.routers.ozm-oidc.entrypoints=websecure"
      - "traefik.http.routers.ozm-oidc.tls=true"
      - "traefik.http.services.ozm-oidc.loadbalancer.server.port=5556"
    deploy: *limits-small
    healthcheck:
      test: ["CMD", "java", "-version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── Коллектор OTel: поднимается на всех контурах, портов на хост не отдаёт ──
  ozm-otel:
    image: ${DOCKER_PROXY_HOST_1:-docker.io}/otel/opentelemetry-collector-contrib:0.111.0
    container_name: ozm-otel
    logging: *default-logging
    env_file:
      - ${ENV_DIR:-env.local}/.env.otel
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ${OTEL_CONFIG_DIR:-./env.local/otel}:/etc/otel:ro
    networks:
      - ozm-net
    deploy: *limits-small
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── БД локального стенда (на контурах — managed PostgreSQL) ─────────────────
  ozm-postgres:
    profiles: ["local"]
    image: ${DOCKER_PROXY_HOST_1:-docker.io}/postgres:16-alpine
    container_name: ozm-postgres
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - ${ENV_DIR:-env.local}/.env.pg
    # Контейнер postgres читает POSTGRES_*, а контур несёт канонические PG*:
    # владельцем схемы становится роль миграций (PG_MIGRATE_*), рантайм-роль
    # заводит init-roles.sql. Значения приходят интерполяцией — то есть через
    # окружение процесса compose (--env-file, см. шапку), а не через env_file.
    environment:
      POSTGRES_USER: ${PG_MIGRATE_USER:-ozm_migrate}
      POSTGRES_PASSWORD: ${PG_MIGRATE_PASSWORD:-ozm_local_pg_pw}
      POSTGRES_DB: ${PGDATABASE:-ozm}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # init-скрипты — принадлежность локального стенда (на контуре БД managed),
      # поэтому путь не следует за ENV_DIR: так же устроен бланк нормы.
      - ./env.local/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - ozm-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ozm_migrate} -d $${POSTGRES_DB:-ozm}"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy: *limits-small

  # ── Миграции: отдельный прогон под ролью владельца схемы ────────────────────
  ozm-migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ozm-backend:local
    container_name: ozm-migrate
    entrypoint: ["/app/ozm-migrate"]
    restart: "no"
    env_file:
      - ${ENV_DIR:-env.local}/.env.app
      - ${ENV_DIR:-env.local}/.env.pg
    environment:
      DICTS_BASELINE_DIR: /config/dicts
    volumes:
      - ../backend/dicts:/config/dicts:ro
    networks:
      - ozm-net
    # required: false — на контуре БД managed и сервиса ozm-postgres в модели нет.
    depends_on:
      ozm-postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy: *limits-small

  # ── API: наружу не публикуется, вход через ozm-web и traefik ────────────────
  ozm-api:
    image: ozm-backend:local
    container_name: ozm-api
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - ${ENV_DIR:-env.local}/.env.app
      - ${ENV_DIR:-env.local}/.env.pg
      - ${ENV_DIR:-env.local}/.env.oidc
      - ${ENV_DIR:-env.local}/.env.otel
      - ${ENV_DIR:-env.local}/.env.smtp
    expose:
      - "8080"
    # Один раз открытая база: без него контейнеры не имеют ключа и (при
    # OIDC_TRUSTED_ISSUER по https://oidc.localhost) падает TLS-проверка клиента.
    # Пока OIDC в продукте не реализован, фактические запросы в ozm-oidc идут
    # только с хоста; строка оставлена как в бланке нормы.
    extra_hosts:
      - "oidc.localhost:host-gateway"
    networks:
      - ozm-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ozm-api.rule=Host(`api.localhost`)"
      - "traefik.http.routers.ozm-api.entrypoints=websecure"
      - "traefik.http.routers.ozm-api.tls=true"
      - "traefik.http.services.ozm-api.loadbalancer.server.port=8080"
    tmpfs:
      - /tmp
    depends_on:
      ozm-postgres:
        condition: service_healthy
        required: false
      ozm-migrate:
        condition: service_completed_successfully
        required: false
      ozm-otel:
        condition: service_started
    healthcheck:
      test: ["CMD", "/app/ozm-server", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1G }
        reservations: { cpus: "0.20", memory: 256M }

  # ── Вход: nginx фронта; единственный published-порт контура ─────────────────
  ozm-web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: ozm-frontend:local
    container_name: ozm-web
    logging: *default-logging
    restart: unless-stopped
    # Доверенная сеть прокси для realip: значение приходит из окружения процесса
    # compose (--env-file env.<контур>/.env.app), а не из env_file сервиса.
    environment:
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1/32}
    networks:
      - ozm-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ozm-web.rule=Host(`app.localhost`)"
      - "traefik.http.routers.ozm-web.entrypoints=websecure"
      - "traefik.http.routers.ozm-web.tls=true"
      - "traefik.http.services.ozm-web.loadbalancer.server.port=8080"
    # Адрес публикации — из контура: локально 127.0.0.1:8088 (чтобы не спорить
    # с traefik на :80/:443 и не смотреть наружу), на контурах 0.0.0.0:80.
    ports:
      - "${WEB_HOST_IP:-0.0.0.0}:${WEB_HOST_PORT:-80}:8080"
    depends_on:
      ozm-api:
        condition: service_started
      ozm-ocr:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy: *limits-small

  # ── OCR таблиц ИД: продуктовая часть поставки, снаружи только через web ─────
  ozm-ocr:
    build:
      context: ../ocr
      dockerfile: Dockerfile
    image: ozm-ocr:local
    container_name: ozm-ocr
    logging: *default-logging
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - ozm-net
    depends_on:
      ozm-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/capabilities', timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: "2.00", memory: 2G }
        reservations: { cpus: "0.30", memory: 512M }

networks:
  ozm-net:
    driver: bridge

volumes:
  postgres-data:
