# Стек для сервера (одна машина с Docker). Локально предпочтительнее
# docker-compose.local.yml. Перед up: cp deploy/env.prod.example .env, заполнить
# POSTGRES_PASSWORD и API_TOKEN, создать deploy/htpasswd — см. docs/deploy.md.
# Пути к исходникам — через ../ : на сервере junction-ов dev/backend и т.п. нет.
#
# Имена сервисов — как в контурах поставки infra/env.<контур>/.env.*: PGHOST
# контура ссылается на ozm-postgres, nginx фронта — на ozm-api и ozm-ocr.

services:
  ozm-migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ozm-backend
    entrypoint: ["/app/ozm-migrate"]
    environment:
      PGHOST: ${PGHOST:-ozm-postgres}
      PGPORT: ${PGPORT:-5432}
      PGUSER: ${PGUSER:-${POSTGRES_USER:-ozm}}
      PGPASSWORD: ${PGPASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required — set it in .env (see deploy/env.prod.example)}}
      PGDATABASE: ${PGDATABASE:-${POSTGRES_DB:-ozm}}
      PGSSLMODE: ${PGSSLMODE:-disable}
      # Владелец схемы: если контур его задал, миграции идут под ним (решение D3).
      PG_MIGRATE_USER: ${PG_MIGRATE_USER:-}
      PG_MIGRATE_PASSWORD: ${PG_MIGRATE_PASSWORD:-}
      DICTS_BASELINE_DIR: /config/dicts
    volumes:
      - ../backend/dicts:/config/dicts:ro
    depends_on:
      ozm-postgres:
        condition: service_healthy
    restart: "no"

  ozm-api:
    image: ozm-backend
    expose:
      - "8080"
    environment:
      CALC_OZM_APP_ADMIN_TOKEN: ${CALC_OZM_APP_ADMIN_TOKEN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CALC_OZM_APP_ENABLE_METRICS: ${CALC_OZM_APP_ENABLE_METRICS:-false}
      CALC_OZM_APP_ENABLE_API_DOCS: ${CALC_OZM_APP_ENABLE_API_DOCS:-false}
      PGHOST: ${PGHOST:-ozm-postgres}
      PGPORT: ${PGPORT:-5432}
      PGUSER: ${PGUSER:-${POSTGRES_USER:-ozm}}
      PGPASSWORD: ${PGPASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required — set it in .env (see deploy/env.prod.example)}}
      PGDATABASE: ${PGDATABASE:-${POSTGRES_DB:-ozm}}
      PGSSLMODE: ${PGSSLMODE:-disable}
      # /api/v1/ext (импорт распознанных таблиц, справочник масс) нужен для OCR
      CALC_OZM_APP_OCR_ENABLED: ${CALC_OZM_APP_OCR_ENABLED:-true}
      # Собственной аутентификации пока нет (OIDC — TODO): бэкенд доступен только
      # из сети compose, снаружи его закрывают пароль nginx и API_TOKEN.
      CALC_OZM_APP_AUTH_DEV_MODE: ${CALC_OZM_APP_AUTH_DEV_MODE:-true}
      CALC_OZM_APP_STORAGE_DIR: ${CALC_OZM_APP_STORAGE_DIR:-/tmp/ozm-blobs}
    depends_on:
      ozm-postgres:
        condition: service_healthy
      ozm-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 1g
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/app/ozm-server", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  ozm-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ozm}
      POSTGRES_USER: ${POSTGRES_USER:-ozm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required — set it in .env (see deploy/env.prod.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ozm} -d ${POSTGRES_DB:-ozm}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ozm-web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # токен зашивается в бандл; nginx пропускает в /api/ только его
        VITE_AUTH_DEV_TOKEN: ${API_TOKEN:?API_TOKEN required — set it in .env (openssl rand -hex 24)}
    ports:
      - "${HOST_PORT:-80}:8080"
    environment:
      API_TOKEN: ${API_TOKEN}
      # Доверенная сеть прокси для realip: на сервере за nginx стоит Caddy или
      # балансировщик. По умолчанию «никому не верить» — тогда X-Forwarded-For
      # не принимается и клиентским адресом остаётся адрес прокси.
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1/32}
      # entrypoint nginx подставляет в шаблоны только эти переменные: default.conf
      # прод-контура (API_TOKEN) и realip.conf (TRUSTED_PROXY_CIDR)
      NGINX_ENVSUBST_FILTER: ^(TRUSTED_PROXY_CIDR|API_TOKEN)$$
    volumes:
      - ./deploy/nginx.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/htpasswd:/etc/nginx/.htpasswd:ro
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      ozm-api:
        condition: service_healthy

  # OCR таблиц ИД (страница и API под /ocr/ через nginx фронтенда).
  # Шрифты для шаблонов глифов: *.ttf (ISOCPEUR, GOST) в каталоге OCR_FONTS_DIR;
  # без них работают только Liberation/DejaVu и качество на чертёжных листах ниже.
  ozm-ocr:
    build:
      context: ../ocr
      dockerfile: Dockerfile
    image: ozm-ocr
    expose:
      - "8000"
    volumes:
      - "${OCR_FONTS_DIR:-./deploy/fonts}:/usr/share/fonts/windows:ro"
      - ocr-jobs:/tmp/ocrpdf-jobs
      # дисковый кэш шаблонов глифов (см. ocr/README.md, «Кэш шаблонов»)
      - ocr-templates:/tmp/ocrpdf-templates
    environment:
      # пределы на одно задание: страниц, секунд на страницу, минимум на задание
      # (задания выполняются по одному, см. ocr/README.md «Пределы на одно задание»)
      OCRPDF_MAX_PAGES: ${OCRPDF_MAX_PAGES:-10}
      OCRPDF_MAX_SEC_PER_PAGE: ${OCRPDF_MAX_SEC_PER_PAGE:-300}
      OCRPDF_MIN_JOB_SEC: ${OCRPDF_MIN_JOB_SEC:-600}
      # кэш шаблонов: объём в памяти, папка и предел на диске
      OCRPDF_TEMPLATE_CACHE_MB: ${OCRPDF_TEMPLATE_CACHE_MB:-512}
      OCRPDF_TEMPLATE_CACHE_DIR: /tmp/ocrpdf-templates
      OCRPDF_TEMPLATE_DISK_MB: ${OCRPDF_TEMPLATE_DISK_MB:-512}
    restart: unless-stopped
    mem_limit: 3g

  # HTTPS (по желанию): docker compose --profile tls up -d. Нужен домен на сервер,
  # в .env — PUBLIC_DOMAIN и HOST_PORT=127.0.0.1:8081, чтобы фронт не торчал наружу.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - ozm-web
    restart: unless-stopped

volumes:
  pgdata: {}
  ocr-jobs: {}
  ocr-templates: {}
  caddy-data: {}
  caddy-config: {}
