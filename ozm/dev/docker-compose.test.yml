# Postgres-only for go test / integration.
# TEST_DATABASE_URL=postgres://test:test@localhost:15432/ozm_test?sslmode=disable

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: ozm_test
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d ozm_test"]
      interval: 3s
      timeout: 3s
      retries: 20
