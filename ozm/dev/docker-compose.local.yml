services:
  ozm-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ozm-backend:local
    entrypoint: ["/app/ozm-migrate"]
    environment:
      # Имена — канонические из §12 корп. шаблона, те же, что в контурах
      # infra/env.<контур>/.env.pg (см. backend/internal/envconfig).
      PGHOST: ozm-postgres
      PGPORT: "5432"
      PGUSER: ozm
      PGPASSWORD: ozm
      PGDATABASE: ozm
      PGSSLMODE: disable
      # Локальный стенд: роли рантайма и владельца схемы совпадают, поэтому
      # PG_MIGRATE_* не задаём — миграции идут под PGUSER.
      DICTS_BASELINE_DIR: /config/dicts
    volumes:
      - ./backend/dicts:/config/dicts:ro
    depends_on:
      ozm-postgres:
        condition: service_healthy
    restart: "no"

  ozm-api:
    image: ozm-backend:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PGHOST: ozm-postgres
      PGPORT: "5432"
      PGUSER: ozm
      PGPASSWORD: ozm
      PGDATABASE: ozm
      PGSSLMODE: disable
      HTTP_ADDR: ":8080"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      LOG_LEVEL: info
      # OCR on for local (AUTH_DEV_MODE). Live PDF pipeline needs pdftoppm/LLM — Phase 3.
      CALC_OZM_APP_OCR_ENABLED: "true"
      CALC_OZM_APP_AUTH_DEV_MODE: "true"
      CALC_OZM_APP_STORAGE_DIR: /tmp/ozm-blobs
      CALC_OZM_APP_VISION_PROVIDER: ollama
      CALC_OZM_APP_OLLAMA_URL: http://host.docker.internal:11434
    depends_on:
      ozm-postgres:
        condition: service_healthy
      ozm-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/app/ozm-server", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  ozm-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:8080"
    # nginx проксирует /ocr/ -> ozm-ocr:8000 (имя резолвится на каждом запросе,
    # поэтому UI поднимается и без OCR — тогда /ocr/ отдаёт 502)
    depends_on:
      ozm-api:
        condition: service_healthy
    restart: unless-stopped

  # Распознавание таблиц ИД (python, ../ocr). Порт 8000 наружу — для vite
  # dev-сервера (proxy /ocr -> localhost:8000) и ручных проверок API.
  ozm-ocr:
    build:
      context: ./ocr
      dockerfile: Dockerfile
    image: ozm-ocr:local
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # чертёжные шрифты (ISOCPEUR, GOST type A/B, GOST Common) — шаблоны глифов
      # для листов без текстового слоя; без них качество на таких листах падает.
      # На другой ОС задайте OCR_FONTS_DIR в .env (каталог с *.ttf).
      - "${OCR_FONTS_DIR:-C:/Windows/Fonts}:/usr/share/fonts/windows:ro"
      # результаты заданий (живут 6 часов) переживают перезапуск контейнера
      - ocr-jobs:/tmp/ocrpdf-jobs
      # дисковый кэш шаблонов глифов (см. ocr/README.md, «Кэш шаблонов»)
      - ocr-templates:/tmp/ocrpdf-templates
    environment:
      # пределы на одно задание (см. ocr/README.md, «Пределы на одно задание»)
      OCRPDF_MAX_PAGES: ${OCRPDF_MAX_PAGES:-10}
      OCRPDF_MAX_SEC_PER_PAGE: ${OCRPDF_MAX_SEC_PER_PAGE:-300}
      OCRPDF_MIN_JOB_SEC: ${OCRPDF_MIN_JOB_SEC:-600}
      # кэш шаблонов: объём в памяти, папка и предел на диске
      OCRPDF_TEMPLATE_CACHE_MB: ${OCRPDF_TEMPLATE_CACHE_MB:-512}
      OCRPDF_TEMPLATE_CACHE_DIR: /tmp/ocrpdf-templates
      OCRPDF_TEMPLATE_DISK_MB: ${OCRPDF_TEMPLATE_DISK_MB:-512}
    restart: unless-stopped

  ozm-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ozm
      POSTGRES_PASSWORD: ozm
      POSTGRES_DB: ozm
    volumes:
      - pgdata-local:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ozm -d ozm"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata-local: {}
  ocr-jobs: {}
  ocr-templates: {}
