server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Имя upstream резолвим на каждом запросе через DNS Docker (127.0.0.11): при
  # перезапуске бэкенд получает новый IP, а nginx с proxy_pass по имени
  # запоминает адрес один раз при старте и потом отдаёт 502 на всё.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $ozm_backend http://ozm-backend:8080;
  set $ozm_ocr http://ocr:8000;

  location /api/ {
    proxy_pass $ozm_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # OCR-сервис (контейнер `ocr` из compose): страница и API под /ocr/.
  # Сервис живёт в корне, префикс сообщаем заголовком — он строит ссылки от него.
  location /ocr/ {
    rewrite ^/ocr/(.*)$ /$1 break;
    proxy_pass $ozm_ocr;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /ocr;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    client_max_body_size 100m;
  }
  location = /ocr {
    return 301 /ocr/;
  }

  # Бандлы Vite именованы хэшем содержимого — их можно кэшировать навсегда,
  # а index.html, который на них ссылается, кэшировать нельзя: иначе после
  # пересборки браузер ещё долго открывает старый бандл.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri/ /index.html;
  }
}
